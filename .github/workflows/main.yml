name: Build macOS DMG (ImageMap port)

on:
  workflow_dispatch:
  push:
    branches: [claude/build-for-mac-uwtra6, claude/peaceful-planck-cdw35y, main]
    paths: ['ci/**', '.github/workflows/main.yml', 'apply.sh', 'patches/**', 'bambustudio/**']

permissions:
  contents: write

concurrency:
  group: build-macos-dmg
  cancel-in-progress: false

jobs:
  build:
    name: arm64 DMG
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore deps cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: BambuStudio_dep_mac_arm64.tar.gz
          key: bs-deps-macos26-arm64-926a7192

      - name: Build, pack DMG, publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/build-macos.sh

      # always(): the deps build is the slow part (1-2h), so keep it even when
      # the app build after it fails -- the next run then starts from the app.
      - name: Save deps cache
        if: always() && steps.cache.outputs.cache-hit != 'true' && hashFiles('BambuStudio_dep_mac_arm64.tar.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: BambuStudio_dep_mac_arm64.tar.gz
          key: bs-deps-macos26-arm64-926a7192

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuStudio_macOS_arm64_ImageMap
          path: BambuStudio_arm64_*_ImageMap.dmg
          retention-days: 14
